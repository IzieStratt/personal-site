<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rates over time</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="topbar">
        <h1>RATES OVER TIME</h1>
        <div class="controls">
          <nav class="segmented metrics" aria-label="Metric">
            <button class="active" data-metric="Cap">Cap</button><button data-metric="Turnstile">Turnstile</button><button data-metric="BotID">BotID</button><button data-metric="hCaptcha">hCaptcha</button><button data-metric="Total">Total</button>
          </nav>
          <nav class="segmented source" aria-label="Source">
            <button class="active" data-source="leaderboard">Mine: leaderboard</button><button data-source="code">Mine: my code</button>
          </nav>
        </div>
      </header>
      <p class="subtitle" id="subtitle">Cap.js totals · live leaderboard</p>
      <section class="chips" aria-label="Players">
          <button class="chip selected" data-player="all"><i></i>All players (sum)<b>—</b></button>
      </section>
      <div class="chart-wrap"><svg id="chart" role="img" aria-label="Rates over time chart" viewBox="0 0 1800 470" preserveAspectRatio="none"></svg></div>
      <section class="stats" aria-label="Race stats">
        <article class="stat-card"><span>Your name</span><strong id="your-rank">izie · —</strong><small id="your-total">— total</small></article>
        <article class="stat-card"><span>Speed</span><strong id="your-speed">—/s</strong><small id="your-speed-note">waiting for a second sample</small></article>
        <article class="stat-card"><span>Next person above</span><strong id="next-name">—</strong><small id="next-gap">— ahead</small></article>
        <article class="stat-card"><span>Time to pass them</span><strong id="next-eta">—</strong><small>based on your current speed</small></article>
        <article class="stat-card"><span>Time to #1</span><strong id="first-eta">—</strong><small id="first-gap">— ahead</small></article>
      </section>
      <section class="leaderboard-panel">
        <div class="section-heading"><h2>Leaderboard</h2><span id="leaderboard-updated">Waiting for data</span></div>
        <div class="table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Cap</th><th>Turnstile</th><th>BotID</th><th>hCaptcha</th><th>Total</th><th>Speed</th></tr></thead><tbody id="leaderboard"></tbody></table></div>
      </section>
    </main>
    <script src="app-live.js"></script>
  </body>
</html>
