<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>izie status</title>
    <meta name="description" content="Is everything izie runs up? Live status and a year of uptime.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://blog.izie.top/style.css">
    <link rel="stylesheet" href="status.css">
    <script src="/cdn/theme.js"></script>
    <script src="status.js" defer></script>
  </head>
  <body>
    <main class="comments">
      <h1>izie status</h1>
      <p id="banner" class="banner" role="status">checking…</p>
      <p id="updated" class="hint"></p>

      <div id="groups"></div>

      <section id="graph-section" aria-labelledby="graph-title" hidden>
        <h2 id="graph-title">uptime, past year</h2>
        <label class="pick"><span>show</span>
          <select id="pick"><option value="">everything</option></select>
        </label>
        <div class="graph-wrap">
          <div id="months" class="months" aria-hidden="true"></div>
          <div id="graph" class="graph" role="img" aria-label="Uptime for each day of the past year"></div>
        </div>
        <p id="graph-note" class="hint"></p>
        <div class="legend" aria-hidden="true">
          <span>down</span>
          <i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i><i class="cell l4"></i>
          <span>up</span>
          <i class="cell l0"></i><span>no data</span>
        </div>
      </section>
      <footer id="build" class="hint" hidden></footer>
    </main>
  </body>
</html>
